[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "graham-nyse"
version = "1.0.0"
description = "Deterministic Graham-style portfolio construction across NYSE-listed operating companies"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "scipy>=1.14",
  "typer>=0.12",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11,<2.0", "types-PyYAML>=6.0"]
data = ["wrds>=3.3", "psycopg2-binary>=2.9"]
infrastructure = [
  "cvxpy>=1.6",
  "duckdb>=1.2",
  "exchange-calendars>=4.8",
  "linearmodels>=6.1",
  "pandera>=0.23",
  "polars>=1.24",
  "statsmodels>=0.14",
  "structlog>=25.1",
  "tenacity>=9.0",
]
openbb = ["openbb>=4.4"]
open-data = ["simfin>=1.0"]

[project.scripts]
graham-nyse = "graham_nyse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/graham_nyse"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
ignore_missing_imports = true
