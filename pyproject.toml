[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "graham-nyse"
version = "0.1.0"
description = "Deterministic Graham-style portfolio construction across NYSE-listed operating companies"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "scipy>=1.14",
  "typer>=0.12",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
graham-nyse = "graham_nyse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/graham_nyse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
